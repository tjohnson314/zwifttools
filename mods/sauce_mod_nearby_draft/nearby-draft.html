<!DOCTYPE html>
<html class="transparent-bg" tabindex="0" data-settings-key="nearby-draft-settings-v1">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';"/>
    <title>Nearby Draft - Sauce for Zwift</title>
    <script src="/pages/src/preloads.js"></script>
    <link id="favicon" rel="shortcut icon" href="/pages/images/favicon.png"/>
    <link rel="stylesheet" href="/pages/css/common.css"/>
    <link rel="stylesheet" href="nearby-draft.css"/>
    <script type="module">
        try {
            const {main} = await import('./nearby-draft.mjs');
            main();
        } catch (error) {
            document.querySelector('.empty').textContent = `Nearby Draft load error: ${error.message}`;
        }
    </script>
</head>
<body>
    <div id="titlebar" class="always-visible">
        <header>
            <div class="title">Nearby Draft</div>
            <div class="filler"></div>
            <div class="buttons">
                <a class="button open-settings" href="nearby-draft-settings.html?width=380&amp;height=440&amp;child-window"
                   title="Open settings" target="nearby-draft-settings"><ms>settings</ms></a>
                <div title="Minimize" class="button minimize electron-only"><ms>minimize</ms></div>
                <div title="Close" class="button close electron-only"><ms>close</ms></div>
            </div>
        </header>
    </div>
    <main id="content">
        <div class="list-head"><span>Effective draft</span><span class="rider-count">0 riders</span></div>
        <div class="empty" role="status">Waiting for rider data...</div>
        <div class="draft-rows" aria-label="Nearby riders"></div>
    </main>
</body>
</html>
